name: CI

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

env:
  ARBITRUM_ONE_RPC_URL:  ${{ secrets.ARBITRUM_ONE_RPC_URL }}
  BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Show Forge version
        run: |
          forge --version

      - name: Validate deployment manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifests = sorted(Path("deployments").glob("**/deployment.json"))
          if not manifests:
              raise SystemExit("no deployment manifests found")
          for manifest in manifests:
              with manifest.open(encoding="utf-8") as handle:
                  data = json.load(handle)
              chain_id = data["network"]["chainId"]
              wrapper = data["contracts"]["wrapperProxy"]["address"]
              assert data["schemaVersion"] == 1, manifest
              assert manifest.parent.parent.name == str(chain_id), manifest
              assert manifest.parent.name.lower() == wrapper.lower(), manifest
              transactions = data["deployment"]["transactions"]
              hashes = [transaction["hash"] for transaction in transactions]
              assert transactions and all(transaction["status"] == 1 for transaction in transactions), manifest
              assert len(hashes) == len(set(hashes)), manifest
              print(f"validated {manifest}")
          PY

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build and contract size check
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
